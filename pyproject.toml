[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm-crypto"
version = "0.1.0"
description = "Détection et prédiction des régimes de marché crypto par Modèles de Markov Cachés"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# hmmlearn n'a pas encore de wheel pour Python 3.14 ; utilisé uniquement pour
# la validation croisée (le test correspondant est sauté s'il est absent).
crosscheck = ["hmmlearn>=0.3"]
dashboard = ["streamlit>=1.30", "plotly>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
